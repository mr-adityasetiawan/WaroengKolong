name: Android CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    name: Auto-create pull request
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    steps:
      - name: Create PR if missing
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
            });
            if (existing.data.length > 0) {
              core.info(`PR already exists: ${existing.data[0].html_url}`);
              return;
            }
            const created = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: `Auto PR: ${branch}`,
              body: [
                'Auto-created by GitHub Actions after branch push.',
                '',
                '## Checks',
                '- Flutter analyze/test/build APK',
                '- Backend smoke test',
              ].join('\n'),
            });
            core.info(`Created PR: ${created.data.html_url}`);

  flutter-android:
    name: Flutter analyze, test, and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK artifact
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: waroengkolong-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  backend:
    name: Backend smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run backend tests
        run: npm test
